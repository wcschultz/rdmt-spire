# This workflow will install Python dependencies, run tests and lint with a variety of Python versions

name: rdmt-spire-pipeline

on: [push, pull_request]

# Restrict the entire workflow to read-only access
permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Cache pip dependencies
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install .[test]
    - name: Ruff Test
      run: |
        ruff check .
    - name: Pytest with coverage
      run: |
        pytest --cov=rdmt_spire --cov-report=xml
    - name: Create Zip Archive
      run: |
        PACKAGE_VERSION=$(pip show rdmt-spire | grep Version | awk '{print $2}')
        echo "PACKAGE_VERSION=$PACKAGE_VERSION" > version.env
        chmod +x version.env
        cd ..
        zip -r rdmt-spire-4-aws.zip rdmt-spire -x "rdmt-spire/.git/*" "rdmt-spire/.github/*" "rdmt-spire/.pytest_cache/*" "rdmt-spire/.ruff_cache/*" "rdmt-spire/build/*" "rdmt-spire/rdmt_spire.egg-info/*" "rdmt-spire/sql_layer/*"
        unzip rdmt-spire-4-aws.zip -d rdmt-spire/rdmt-spire-4-aws
        cp -r rdmt-spire/rdmt-spire-4-aws rdmt-spire/rdmt-spire-4-aws-alembic
        mv rdmt-spire/rdmt-spire-4-aws-alembic/rdmt-spire/alembic.Dockerfile rdmt-spire/rdmt-spire-4-aws-alembic/rdmt-spire/Dockerfile
    - name: Upload Monitor Zip Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: rdmt-spire-4-aws
        path: rdmt-spire-4-aws
    - name: Upload Alembic Zip Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: rdmt-spire-4-aws-alembic
        path: rdmt-spire-4-aws-alembic